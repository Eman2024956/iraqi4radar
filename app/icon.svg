<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#041f17" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Radar / Data Extraction Pulse Rings -->
  <circle cx="60" cy="54" r="38" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4" />
  <circle cx="60" cy="54" r="48" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2 6" opacity="0.25" />

  <!-- Glowing Pin Body -->
  <path d="M60 22 C43 22 30 35 30 52 C30 73 55 93 58.5 96 C59.4 96.8 60.6 96.8 61.5 96 C65 93 90 73 90 52 C90 35 77 22 60 22 Z"
        fill="url(#pinGrad)" filter="url(#glow)" />

  <!-- Inner Data Core / Message Symbol -->
  <circle cx="60" cy="50" r="16" fill="#022c22" />
  <circle cx="60" cy="50" r="12" fill="url(#goldGrad)" />
  
  <!-- WhatsApp / Communication Dot -->
  <circle cx="78" cy="34" r="6.5" fill="#25D366" stroke="#022c22" stroke-width="2" />
  <circle cx="78" cy="34" r="2.5" fill="#ffffff" />
</svg>
